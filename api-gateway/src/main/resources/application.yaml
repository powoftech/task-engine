server:
  port: 8080

spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_engine}
    username: ${DB_USER:green_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000 # 30 seconds
      idle-timeout: 600000 # 10 minutes
      max-lifetime: 1800000 # 30 minutes
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        type:
          "[json_format_mapper]": com.greennode.api_gateway.utilities.CustomHibernateJsonFormatter

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:green_user}
    password: ${MQ_PASSWORD:}
    ssl:
      enabled: ${MQ_SSL_ENABLED:false}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

task-engine:
  rabbitmq:
    results-queue: api.job-results.queue
  outbox:
    cleanup:
      enabled: ${OUTBOX_CLEANUP_ENABLED:true}
      retention: ${OUTBOX_CLEANUP_RETENTION:PT24H}
      fixed-delay: ${OUTBOX_CLEANUP_FIXED_DELAY:PT1H}

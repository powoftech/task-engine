services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-green_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-green_password}
      POSTGRES_DB: ${POSTGRES_DB:-task_engine}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/db-init/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-green_user} -d ${POSTGRES_DB:-task_engine} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - task_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-green_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-green_password}
      RABBITMQ_DEFAULT_VHOST: /
    entrypoint: ["sh", "/usr/local/bin/rabbitmq-bootstrap.sh"]
    command: ["rabbitmq-server"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/rabbitmq-bootstrap.sh:/usr/local/bin/rabbitmq-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - task_network
    restart: unless-stopped

  debezium:
    image: quay.io/debezium/server:3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-green_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-green_password}
      POSTGRES_DB: ${POSTGRES_DB:-task_engine}
      RABBITMQ_USER: ${RABBITMQ_USER:-green_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-green_password}
    volumes:
      - debezium_data:/debezium/data
      - ./infra/debezium/application.properties:/debezium/config/application.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - task_network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-green_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-green_password}
      DB_NAME: ${POSTGRES_DB:-task_engine}
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: ${RABBITMQ_USER:-green_user}
      MQ_PASSWORD: ${RABBITMQ_PASSWORD:-green_password}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - task_network
    restart: unless-stopped

  worker-node:
    build:
      context: .
      dockerfile: worker-node/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: ${RABBITMQ_USER:-green_user}
      MQ_PASSWORD: ${RABBITMQ_PASSWORD:-green_password}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      HTTP_PORT: 8090
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - task_network
    restart: unless-stopped

  jaeger:
    build:
      context: ./infra/jaeger
      dockerfile: Dockerfile
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    depends_on:
      api-gateway:
        condition: service_healthy
      worker-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:13133/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - task_network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  debezium_data:

networks:
  task_network:
    driver: bridge
